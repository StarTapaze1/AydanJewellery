<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linklərim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1c1710;
    --paper: #faf6ee;
    --card: #ffffff;
    --gold: #c8863a;
    --gold-soft: #f0dcc0;
    --line: rgba(28,23,16,0.10);
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --ink: #f3ede1;
      --paper: #17140f;
      --card: #201b14;
      --gold: #e3a35c;
      --gold-soft: #3a2f1e;
      --line: rgba(243,237,225,0.12);
    }
  }
  :root[data-theme="dark"] {
    --ink: #f3ede1;
    --paper: #17140f;
    --card: #201b14;
    --gold: #e3a35c;
    --gold-soft: #3a2f1e;
    --line: rgba(243,237,225,0.12);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--paper);
    background-image:
      radial-gradient(circle at 50% -10%, var(--gold-soft) 0%, transparent 55%);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    display: flex;
    justify-content: center;
    padding: 72px 20px 48px;
  }

  .page {
    width: 100%;
    max-width: 420px;
  }

  .avatar-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 24px;
  }

  .avatar {
    width: 170px;
    height: 170px;
    border-radius: 50%;
    background: linear-gradient(155deg, var(--gold), #a8642a);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Fraunces', serif;
    font-size: 32px;
    font-weight: 500;
    color: #fff;
    overflow: hidden;
    box-shadow: 0 8px 24px -6px rgba(200,134,58,0.45);
    border: 3px solid var(--paper);
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.2); }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 32px;
    text-align: center;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .bio {
    text-align: center;
    font-size: 15px;
    line-height: 1.55;
    color: var(--ink);
    opacity: 0.65;
    margin: 0 auto 40px;
    max-width: 300px;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 13px;
  }

  .link-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 17px 20px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    text-decoration: none;
    color: var(--ink);
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    box-shadow: 0 1px 2px rgba(28,23,16,0.04);
  }

  .link-row:hover,
  .link-row:focus-visible {
    transform: translateY(-2px);
    border-color: var(--gold);
    box-shadow: 0 10px 24px -10px rgba(200,134,58,0.35);
  }
  .link-row:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }

  .link-icon {
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    color: var(--gold);
  }

  .link-label {
    font-size: 15.5px;
    font-weight: 500;
    flex: 1;
  }

  .link-arrow {
    opacity: 0.35;
    font-size: 15px;
    transition: opacity 0.18s ease, transform 0.18s ease;
  }
  .link-row:hover .link-arrow {
    opacity: 0.9;
    transform: translateX(2px);
  }

  button.link-row {
    font-family: inherit;
    width: 100%;
    cursor: pointer;
  }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 50;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.active { display: flex; }

  .modal-box {
    background: var(--card);
    border-radius: 18px;
    padding: 28px 24px 24px;
    max-width: 320px;
    width: 100%;
    text-align: center;
    position: relative;
    box-shadow: 0 20px 50px -12px rgba(0,0,0,0.4);
  }

  .modal-close {
    position: absolute;
    top: 14px;
    right: 14px;
    background: none;
    border: none;
    font-size: 18px;
    color: var(--ink);
    opacity: 0.5;
    cursor: pointer;
    line-height: 1;
    padding: 4px;
  }
  .modal-close:hover { opacity: 1; }

  .modal-title {
    font-family: 'Fraunces', serif;
    font-size: 21px;
    font-weight: 500;
    margin: 0 0 18px;
  }

  #wifiQr {
    display: block;
    margin: 0 auto 12px;
    border-radius: 8px;
    max-width: 100%;
    height: auto;
  }

  .modal-hint {
    font-size: 12.5px;
    opacity: 0.55;
    margin: 0 0 20px;
    line-height: 1.4;
  }

  .wifi-field {
    text-align: left;
    margin-bottom: 12px;
  }

  .wifi-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    opacity: 0.5;
    font-weight: 600;
  }

  .wifi-value-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 4px;
    padding: 10px 12px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 10px;
  }

  .wifi-value {
    font-size: 15px;
    font-weight: 600;
    font-family: monospace;
    word-break: break-all;
  }

  .copy-btn {
    flex-shrink: 0;
    font-size: 12px;
    font-weight: 600;
    color: var(--gold);
    background: var(--gold-soft);
    border: none;
    padding: 6px 10px;
    border-radius: 999px;
    cursor: pointer;
  }
  .copy-btn:hover { opacity: 0.85; }

  footer {
    text-align: center;
    margin-top: 28px;
    font-size: 12.5px;
    opacity: 0.4;
    letter-spacing: 0.02em;
  }

  .powered-by {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    margin-top: 16px;
    padding: 9px 16px;
    background: var(--gold-soft);
    border: 1px solid var(--gold);
    border-radius: 999px;
    font-size: 13.5px;
    font-weight: 700;
    color: var(--gold);
    opacity: 1;
  }

  .powered-by svg {
    width: 17px;
    height: 17px;
  }

  .brand-logo {
    display: block;
    height: 52px;
    width: auto;
    margin: 16px auto 0;
    opacity: 1;
  }

  @media (max-width: 380px) {
    body { padding: 56px 16px 40px; }
    h1 { font-size: 27px; }
  }
</style>
</head>
